services:
  - type: web
    name: yuiapi-ofc
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: YUI_API_KEY
        sync: false
      - key: YUI_ADMIN_USERNAME
        value: Yui
      - key: YUI_ADMIN_EMAIL
        sync: false
      - key: YUI_ADMIN_PASSWORD
        sync: false
      - key: YUI_JWT_SECRET
        sync: false
      - key: YUI_SESSION_EXPIRES
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
