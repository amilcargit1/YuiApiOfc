<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · YuiAPI</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#351653,#080912 65%);color:#f7f4ff;font-family:system-ui,sans-serif;padding:24px}.wrap{width:min(850px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a,.top button,.keybtn{border:1px solid #302642;background:#10111d;color:#eee;padding:10px 14px;border-radius:12px;text-decoration:none;cursor:pointer}.hero,.card{margin-top:18px;padding:25px;border:1px solid #302642;border-radius:22px;background:#10111dcc;box-shadow:0 20px 60px #0005}.hero{display:flex;gap:20px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#9b65ff33;border:1px solid #9b65ff88;font-size:28px}.muted{color:#a9afc3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:18px;border-radius:16px;background:#080a12;border:1px solid #27243a}.stat b{display:block;font-size:24px;margin-bottom:5px;color:#d7c4ff}.keyrow{display:flex;gap:9px;align-items:center;margin:10px 0 20px}.key{font-family:monospace;word-break:break-all;color:#d9c6ff;background:#080a12;border:1px solid #27243a;border-radius:12px;padding:12px;flex:1}.keybtn{white-space:nowrap;background:#9b65ff22;border-color:#9b65ff66}.msg{color:#ffb5c9;margin-top:12px}input{display:block;width:100%;box-sizing:border-box;margin:9px 0;padding:12px;border-radius:11px;border:1px solid #302642;background:#080a12;color:#fff}.save{margin-top:4px}</style></head><body><main class="wrap"><div class="top"><strong>🌸 YuiAPI OFC</strong><div><a href="/">Inicio</a> <button id="logout">Cerrar sesión</button></div></div><section class="hero"><div class="avatar" id="avatar">🌸</div><div><h1 id="name">Cargando...</h1><div class="muted" id="email"></div><div class="muted" id="plan"></div></div></section><section class="card"><h2>🔑 Tu API Key</h2><p class="muted">Usa esta llave para consumir los endpoints que requieran autenticación.</p><div class="keyrow"><div id="key" class="key">••••••••••••••••••••</div><button class="keybtn" id="toggleKey">👁 Mostrar</button><button class="keybtn" id="copyKey">📋 Copiar</button></div><div class="grid"><div class="stat"><b id="today">0</b>requests hoy</div><div class="stat"><b id="total">0</b>requests totales</div><div class="stat"><b id="limit">0</b>límite diario</div><div class="stat"><b id="remaining">0</b>restantes</div></div><div id="keyMsg" class="msg"></div></section><section class="card"><h2>Actualizar perfil</h2><input id="newName" placeholder="Nuevo usuario"><input id="newEmail" placeholder="Nuevo correo"><input id="newPass" type="password" placeholder="Nueva contraseña"><button id="save" class="keybtn save">Guardar cambios</button><div id="msg" class="msg"></div></section></main><script>const token=localStorage.getItem('yui_token');if(!token)location.href='/login.html';const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});let apiKey='';let visible=false;async function load(){const r=await fetch('/api/auth/me',{headers:headers()});if(!r.ok){localStorage.removeItem('yui_token');return location.href='/login.html'}const d=await r.json(),u=d.data;document.querySelector('#name').textContent=u.username||'YuiUser';document.querySelector('#email').textContent=u.email||'';document.querySelector('#plan').textContent=(u.role||'user')+' · '+(u.plan||'free');apiKey=u.key||'';document.querySelector('#avatar').textContent=(u.username||'Y').slice(0,1).toUpperCase();document.querySelector('#today').textContent=u.requests?.today??0;document.querySelector('#total').textContent=u.requests?.total??0;document.querySelector('#limit').textContent=u.requests?.limit??0;document.querySelector('#remaining').textContent=u.requests?.remaining??0;renderKey()}function renderKey(){document.querySelector('#key').textContent=visible&&apiKey?apiKey:'••••••••••••••••••••';document.querySelector('#toggleKey').textContent=visible?'🙈 Ocultar':'👁 Mostrar'}document.querySelector('#toggleKey').onclick=()=>{visible=!visible;renderKey()};document.querySelector('#copyKey').onclick=async()=>{if(!apiKey){keyMsg.textContent='No hay una API key disponible.';return}try{await navigator.clipboard.writeText(apiKey);keyMsg.textContent='✅ API key copiada al portapapeles.'}catch{keyMsg.textContent='No se pudo copiar automáticamente. Muéstrala y cópiala manualmente.'}};document.querySelector('#save').onclick=async()=>{const msg=document.querySelector('#msg');msg.textContent='Guardando...';const body={};if(newName.value.trim())body.username=newName.value.trim();if(newEmail.value.trim())body.email=newEmail.value.trim();if(newPass.value)body.password=newPass.value;const r=await fetch('/api/auth/profile',{method:'PUT',headers:headers(),body:JSON.stringify(body)});const d=await r.json();msg.textContent=d.message||d.error||'';if(r.ok){newName.value='';newEmail.value='';newPass.value='';load()}};document.querySelector('#logout').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',headers:headers()})}catch{}localStorage.removeItem('yui_token');location.href='/login.html'};load();</script></body></html>
