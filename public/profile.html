<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · YuiAPI</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#351653,#080912 65%);color:#f7f4ff;font-family:system-ui,sans-serif;padding:24px}.wrap{width:min(850px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a,button{border:1px solid #302642;background:#10111d;color:#eee;padding:10px 14px;border-radius:12px;text-decoration:none;cursor:pointer}.hero,.card{margin-top:18px;padding:25px;border:1px solid #302642;border-radius:22px;background:#10111dcc;box-shadow:0 20px 60px #0005}.hero{display:flex;gap:20px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#9b65ff33;border:1px solid #9b65ff88;font-size:28px}.muted{color:#a9afc3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:18px;border-radius:16px;background:#080a12;border:1px solid #27243a}.stat b{display:block;font-size:24px;margin-bottom:5px;color:#d7c4ff}.key{font-family:monospace;word-break:break-all;color:#d9c6ff}.msg{color:#ffb5c9;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><strong>🌸 YuiAPI OFC</strong><div><a href="/">Inicio</a> <button id="logout">Cerrar sesión</button></div></div><section class="hero"><div class="avatar" id="avatar">🌸</div><div><h1 id="name">Cargando...</h1><div class="muted" id="email"></div><div class="muted" id="plan"></div></div></section><section class="card"><h2>Tu cuenta</h2><p class="muted">API key</p><div id="key" class="key">—</div><div class="grid"><div class="stat"><b id="today">0</b>requests hoy</div><div class="stat"><b id="total">0</b>requests totales</div><div class="stat"><b id="limit">0</b>límite diario</div><div class="stat"><b id="remaining">0</b>restantes</div></div></section><section class="card"><h2>Actualizar perfil</h2><input id="newName" placeholder="Nuevo usuario"><input id="newEmail" placeholder="Nuevo correo"><input id="newPass" type="password" placeholder="Nueva contraseña"><button id="save">Guardar cambios</button><div id="msg" class="msg"></div></section></main><script>const token=localStorage.getItem('yui_token');if(!token)location.href='/login.html';const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});async function load(){const r=await fetch('/api/auth/me',{headers:headers()});if(!r.ok){localStorage.removeItem('yui_token');return location.href='/login.html'}const d=await r.json(),u=d.data;name.textContent=u.username;email.textContent=u.email;plan.textContent=(u.role||'user')+' · '+(u.plan||'free');key.textContent=u.key||'Administración por Render';avatar.textContent=(u.username||'Y').slice(0,1).toUpperCase();today.textContent=u.requests?.today??0;total.textContent=u.requests?.total??0;limit.textContent=u.requests?.limit??0;remaining.textContent=u.requests?.remaining??0}save.onclick=async()=>{msg.textContent='Guardando...';const body={};if(newName.value)body.username=newName.value;if(newEmail.value)body.email=newEmail.value;if(newPass.value)body.password=newPass.value;const r=await fetch('/api/auth/profile',{method:'PUT',headers:headers(),body:JSON.stringify(body)});const d=await r.json();msg.textContent=d.message||d.error||'';if(r.ok){newName.value='';newEmail.value='';newPass.value='';load()}};logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:headers()});localStorage.removeItem('yui_token');location.href='/login.html'};load()</script></body></html>
