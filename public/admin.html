<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · YuiAPI</title><style>body{margin:0;background:radial-gradient(circle at 50% 0,#351653,#080912 65%);color:#f7f4ff;font-family:system-ui,sans-serif;padding:24px}.wrap{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.a{color:#fff;text-decoration:none;border:1px solid #302642;background:#10111d;padding:10px 14px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}.card{padding:20px;border:1px solid #302642;border-radius:20px;background:#10111dcc}.big{font-size:28px;color:#d7c4ff}.table{margin-top:20px;overflow:auto;border:1px solid #302642;border-radius:18px}.row{display:grid;grid-template-columns:1.2fr 1.5fr .8fr .8fr 1fr;min-width:720px;gap:12px;padding:13px 16px;border-bottom:1px solid #242036}.head{color:#a9afc3;font-size:13px}.msg{margin-top:15px;color:#ffb5c9}</style></head><body><main class="wrap"><div class="top"><h1>🌸 Yui Admin</h1><div><a class="a" href="/profile.html">Perfil</a> <a class="a" href="/">Inicio</a></div></div><div id="msg" class="msg"></div><section class="grid"><div class="card"><div class="big" id="users">0</div>Usuarios</div><div class="card"><div class="big" id="requests">0</div>Requests globales</div><div class="card"><div class="big" id="uptime">0s</div>Uptime</div></section><section class="table"><div class="row head"><div>Usuario</div><div>Email</div><div>Plan</div><div>Requests</div><div>API key</div></div><div id="list"></div></section></main><script>const token=localStorage.getItem('yui_token');if(!token)location.href='/login.html';const h={'Authorization':'Bearer '+token};async function load(){try{const [a,b]=await Promise.all([fetch('/api/auth/admin/all',{headers:h}),fetch('/api/auth/dashboard-global')]);const ad=await a.json();if(!a.ok)throw Error(ad.error||'No autorizado');const gd=await b.json();users.textContent=gd.totalUsers??0;requests.textContent=gd.globalRequests??0;uptime.textContent=(gd.uptime??0)+'s';list.innerHTML=(ad.users||[]).map(u=>`<div class="row"><div>${u.username||'—'}</div><div>${u.email||'—'}</div><div>${u.plan||'free'}</div><div>${u.requests?.total??u.totalRequest??0}</div><div>${u.key||'—'}</div></div>`).join('')||'<div class="row">No hay usuarios.</div>'}catch(e){msg.textContent=e.message}}</script></body></html>
