<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · YuiAPI</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#351653,#080912 65%);color:#f7f4ff;font-family:system-ui,sans-serif;padding:20px}.box{width:min(430px,100%);padding:32px;border:1px solid #302642;border-radius:24px;background:#10111dcc;box-shadow:0 25px 80px #0008}h1{margin:0 0 8px}p{color:#a9afc3;line-height:1.6}input{width:100%;box-sizing:border-box;margin:8px 0;padding:13px;border-radius:12px;border:1px solid #302942;background:#080a12;color:#fff}button{width:100%;padding:13px;border:0;border-radius:12px;background:#9b65ff;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}.links{margin-top:18px;text-align:center;font-size:14px}.links a{color:#d9c6ff;text-decoration:none}.msg{margin-top:14px;color:#ffb5c9;white-space:pre-wrap}.brand{color:#c77dff}</style></head><body><main class="box"><div>🌸 <span class="brand">YuiAPI</span> OFC</div><h1>Iniciar sesión</h1><p>Accede a tu cuenta Yui para usar tus endpoints y consultar tu perfil.</p><form id="form"><input id="email" type="email" placeholder="Correo electrónico" required><input id="password" type="password" placeholder="Contraseña" required><button>Entrar</button></form><div id="msg" class="msg"></div><div class="links">¿No tienes cuenta? <a href="/register.html">Registrarte</a> · <a href="/">Inicio</a></div></main><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='Iniciando sesión...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo iniciar sesión');localStorage.setItem('yui_token',d.token);location.href='/profile.html'}catch(x){msg.textContent=x.message}}</script></body></html>
